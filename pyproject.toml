[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ticketideai"
version = "0.1.0"
description = "Customer-support agent that plans in code and commits only policy-checked effects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Venkata SatyaMahesh Gadi" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "langfuse>=5.0",
    "openai>=3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/maheshgadi-ai/TicketideAI"

[project.scripts]
ticketide = "ticketideai.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketideai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately contain look-alike Unicode identifiers.
"tests/tools/test_validator_escapes.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls a real external service; never run in CI"]
