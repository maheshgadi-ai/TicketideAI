# Text/chat models on OpenAI's deprecations page, rejected anywhere in config.
# Source: https://developers.openai.com/api/docs/deprecations (checked 2026-11-15)
#
# Includes both "Upcoming" and "Past" deprecations for models usable through
# the Responses/Chat APIs. Image, audio, realtime, TTS, and transcription models
# are left out: this project never routes a role to them.
#
# Bare aliases (gpt-4o, gpt-4o-mini, gpt-4.1, gpt-4.1-mini) aren't on the page
# themselves, but the snapshots they point to are, so they're listed too.
#
# Update this file when the page changes; tests/config/test_deprecations.py
# fails if any config references a model listed here.

