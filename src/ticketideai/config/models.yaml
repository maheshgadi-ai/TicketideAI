# Default routing profile: role -> model. Agents request a model by role.
# Alternative profile: models.budget.yaml (select with MODELS_CONFIG_PATH).
#
# Each entry: provider (openai | anthropic), model, and optional params:
#   temperature, max_tokens, reasoning_effort
# Roles inherit any params they don't set from `default`.
#
# Override at runtime without editing this file:
#   MODEL__PLANNER=anthropic:claude-opus-5-5    (one role)
#   LLM_PROVIDER=anthropic ANTHROPIC_MODEL=...  (the default entry)
#   MODELS_CONFIG_PATH=path/to/other.yaml       (a whole different profile)

default:
  provider: openai
  model: gpt-6-sol
  # Reasoning tokens count toward this limit.
  max_tokens: 16000

roles:
  # Writes plan code and corrects it after errors. Plan quality drives every
  # outcome, so this gets the strongest coding model.
  planner:
    provider: anthropic
    model: claude-opus-5-5
    reasoning_effort: medium

  # Writes the customer reply from recorded facts: focused, high-volume work.
  responder:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low

  # Eval judge: a different model from both roles it grades.
  judge:
    provider: openai
    model: gpt-6-astra
    reasoning_effort: medium
